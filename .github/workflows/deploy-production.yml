# 本番環境へのデプロイ: deployment/production ブランチへの push（または手動実行）で、
# Vercel の Production 環境（本番用の Supabase）としてデプロイする（rental-system-chi-lac.vercel.app）。
# main への push では何もデプロイしない（vercel.json で Vercel の Git 連携による自動デプロイを止めている）
name: Deploy to Production

on:
  push:
    branches:
      - deployment/production
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      # チーム（tokyodays-projects）は環境変数 VERCEL_ORG_ID で指定する（--scope を付けるとユーザー情報を読みに行き失敗する）
      - name: Deploy to Vercel (Production)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

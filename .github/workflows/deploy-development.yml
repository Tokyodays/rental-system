# 開発環境へのデプロイ: deployment/development ブランチへの push（または手動実行）で、
# Vercel の Preview 環境（開発用の Supabase）としてデプロイし、rental-system-dev.vercel.app に割り当てる。
# main への push では何もデプロイしない（vercel.json で Vercel の Git 連携による自動デプロイを止めている）
name: Deploy to Development

on:
  push:
    branches:
      - deployment/development
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Preview)
        run: |
          DEPLOY_URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          vercel alias set $DEPLOY_URL rental-system-dev.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
